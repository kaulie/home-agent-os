[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-edge"
version = "0.3.0"
description = "Living-room Mac Edge: register, heartbeat, pull intents; Cast via external HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0,<1",
]

[project.scripts]
mac-edge = "mac_edge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
