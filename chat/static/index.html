<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Chatbox</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #111318;
      --panel: #1b1e27;
      --line: #2c3140;
      --text: #e8eaef;
      --muted: #9aa3b5;
      --accent: #6ea8fe;
      --user: #3dd68c;
      --chip: #262b38;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
    aside { border-right: 1px solid var(--line); background: var(--panel); padding: 16px 12px; overflow: auto; }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .hint { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .agent { display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: center; padding: 8px; border-radius: 8px; margin-bottom: 6px; background: var(--chip); }
    .agent .meta { min-width: 0; }
    .agent .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .agent .seen { color: var(--muted); font-size: 11px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 auto; color: #fff;
    }
    .avatar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .avatar.lg { width: 36px; height: 36px; }
    .avatar.lg svg { width: 20px; height: 20px; }
    .avatar.sm { width: 18px; height: 18px; }
    .avatar.sm svg { width: 11px; height: 11px; }
    .avatar.boss { background: #2f9e6a; }
    .avatar.coordinator { background: #6b7cff; }
    .avatar.brain {
      background: radial-gradient(circle at 32% 28%, #ff8ae0 0%, #d61f8a 55%, #9b0870 100%);
      box-shadow: 0 0 0 2px #ffc7ee;
    }
    .avatar.brain svg { width: 22px; height: 22px; stroke-width: 2.2; }
    .avatar.quality {
      background: #0f766e;
      box-shadow: 0 0 0 2px #99f6e4;
    }
    .avatar.runtime { background: #3d8bfd; }
    .avatar.intent { background: #00b4d8; }
    .avatar.capability { background: #f4a261; }
    .avatar.endpoint { background: #9b59b6; }
    .avatar.dba { background: #c9a227; }
    .avatar.all { background: #5c6578; }
    .badge { background: #c45c5c; color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 700; }
    .badge.off { background: transparent; color: var(--muted); font-weight: 500; }
    main { display: flex; flex-direction: column; min-width: 0; }
    #log { flex: 1; overflow: auto; padding: 16px; }
    .msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; margin: 0 0 14px; max-width: 760px; padding: 8px 10px; border-radius: 8px; }
    .msg .bubble { min-width: 0; }
    .msg.incoming-unread { background: #1f2a22; box-shadow: inset 3px 0 0 var(--user); }
    .msg.stale-unacked {
      background: #3a2418;
      box-shadow: inset 3px 0 0 #e08a3c;
    }
    .msg .meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .msg .from { color: var(--accent); font-weight: 600; }
    .msg.boss .from { color: var(--user); }
    .msg .body { white-space: pre-wrap; word-break: break-word; }
    .msg .aud, .msg .reads { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .msg.recalled .body { color: var(--muted); font-style: italic; }
    .msg button.recall {
      margin-top: 6px; border: 1px solid var(--line); background: transparent;
      color: var(--muted); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px;
    }
    .msg button.recall:hover { color: var(--text); border-color: var(--accent); }
    .composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; background: var(--panel); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chips button {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); background: var(--chip); color: var(--text);
      border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    .chips button:hover { border-color: var(--accent); }
    textarea {
      width: 100%; min-height: 72px; resize: vertical; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      padding: 10px; font: inherit;
    }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 12px; }
    .row span { color: var(--muted); font-size: 12px; }
    button.send {
      background: var(--accent); color: #111; border: 0; border-radius: 8px;
      padding: 8px 16px; font-weight: 700; cursor: pointer;
    }
    .empty { color: var(--muted); padding: 24px 0; }
    .avatar-btn {
      border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer;
      border-radius: 50%; line-height: 0; display: inline-flex;
    }
    .avatar-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .avatar.ui { background: #00b4d8; }
    .avatar.controller { background: #5a6acf; }
    .avatar.deploy { background: #2a9d8f; }
    .avatar.sre { background: #6c757d; }
    .agent-popover-backdrop {
      position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: flex-end; justify-content: center; padding: 12px;
    }
    @media (min-width: 520px) {
      .agent-popover-backdrop { align-items: center; }
    }
    .agent-popover {
      width: min(100%, 380px); background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px 16px 14px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      max-height: min(80vh, 520px); overflow: auto;
    }
    .agent-popover .head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
    .agent-popover .head h2 { font-size: 15px; margin: 0; line-height: 1.35; flex: 1; }
    .agent-popover .head .handle { color: var(--accent); font-weight: 700; }
    .agent-popover .duty { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .agent-popover dl { margin: 0; }
    .agent-popover dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 10px; }
    .agent-popover dd { margin: 4px 0 0; font-size: 13px; line-height: 1.45; word-break: break-word; }
    .agent-popover .close {
      border: 1px solid var(--line); background: var(--chip); color: var(--text);
      border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0;
    }
    .agent-popover .phase-idle { color: var(--muted); }
    .agent-popover .phase-active { color: #7dd3a8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Agent Chatbox <span id="bossUnread" class="badge off"></span></h1>
      <p class="hint">未 @ 任何人时，agent 不处理。超过 1 小时仍未读的消息会标成橙色底。页面每 5 秒刷新。</p>
      <div id="agents"></div>
    </aside>
    <main>
      <div id="log"><div class="empty">还没有消息。</div></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <textarea id="body" placeholder="给 agent 派活请 @brain / @all … 不 @ 则只给你自己看。"></textarea>
        <div class="row">
          <span>Enter 发送，Shift+Enter 换行</span>
          <button class="send" id="send" type="button">发送</button>
        </div>
      </div>
    </main>
  </div>
  <script>
    const HANDLES = ["coordinator","controller","brain","runtime","ui","capability","quality","deploy","sre","dba"];
    const NAMES = {
      boss: "boss",
      owner: "boss",
      user: "boss",
      coordinator: "system coordinator agent",
      controller: "dev controller agent",
      brain: "brain agent",
      runtime: "runtime dev agent",
      ui: "UI dev agent",
      intent: "UI dev agent",
      capability: "capability dev agent",
      endpoint: "UI dev agent",
      quality: "quality agent",
      deploy: "deploy agent",
      sre: "sre agent",
      dba: "dba agent",
    };
    const DUTIES = {
      coordinator: "跨层仲裁、催办、日报收口；默认静默，结案用 cc。",
      controller: "唯一常驻 IDE；wake Fleet、汇总进度、Dev Task 入口。",
      brain: "规划、选边、入队、对外 Brain API。",
      runtime: "调度 / hydrate / 前序门；Mac/Android edge runtime。",
      ui: "全部用户交互面：Intent、物流 UI、Cast、Receiver、管理端 UI。",
      capability: "Plugin 契约与实现（非 UI 呈现面）。",
      quality: "黑盒 API 验收 + App UI 自动化（XCUITest）。",
      deploy: "云 Brain 部署（rsync + restart）。",
      sre: "本机/边缘运维、双 Brain、local-rt、架构 runbook。",
      dba: "schema / SQL（Brain SQLite）。",
      boss: "产品方；派活与验收。",
    };
    const PHASE_LABELS = {
      idle: "空闲",
      awaiting_recv: "待签收",
      awaiting_ide: "待 IDE",
      queued: "队列中",
      running: "执行中",
      acked: "已签收",
    };
    const logEl = document.getElementById("log");
    const agentsEl = document.getElementById("agents");
    const chipsEl = document.getElementById("chips");
    const bodyEl = document.getElementById("body");
    let lastId = 0;

    const ICONS = {
      boss: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/>',
      coordinator: '<circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="5" r="1.6"/><circle cx="6.2" cy="16.2" r="1.6"/><circle cx="17.8" cy="16.2" r="1.6"/><path d="M12 9.8V6.6M10.2 13.4 7.4 15.3M13.8 13.4l2.8 1.9"/>',
      brain: '<path fill="currentColor" stroke="none" d="M8.2 6.1A3.7 3.7 0 0 1 12 3.8a3.7 3.7 0 0 1 3.8 2.3 3.4 3.4 0 0 1 3.1 3.4c0 .7-.2 1.3-.6 1.9A3.3 3.3 0 0 1 19.4 14c0 1.9-1.6 3.4-3.5 3.4h-.7v2.4c0 .8-.7 1.5-1.5 1.5H10.3c-.8 0-1.5-.7-1.5-1.5V17.4h-.7C6.2 17.4 4.6 15.9 4.6 14c0-.9.4-1.7 1-2.3-.4-.6-.6-1.2-.6-1.9A3.4 3.4 0 0 1 8.2 6.1z"/><path d="M12 6.4v11.2M8.7 10.1c1.4.7 2.5.5 3.3-.2M8.8 13c1.3.5 2.3.4 3.2-.1M15.3 10.1c-1.4.7-2.5.5-3.3-.2M15.2 13c-1.3.5-2.3.4-3.2-.1"/>',
      quality: '<circle cx="10.2" cy="10.2" r="5.6"/><path d="m14.4 14.4 5 5"/><path d="M8 10.2h4.4M10.2 8v4.4"/>',
      runtime: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.8 6.5l1.6 1.6M17.6 15.9l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.8 17.5l1.6-1.6M17.6 8.1l1.6-1.6"/>',
      intent: '<path d="M5 6.5h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H10l-4 3v-3H5a2 2 0 0 1-2-2v-5a3 3 0 0 1 2-3z"/>',
      ui: '<path d="M5 6.5h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H10l-4 3v-3H5a2 2 0 0 1-2-2v-5a3 3 0 0 1 2-3z"/>',
      capability: '<path d="M9 4h3.2a2 2 0 0 1 2 2v2.2H18a2 2 0 0 1 2 2V14h-2.2v2.2a2 2 0 0 1-2 2H12V16h-2.2a2 2 0 0 1-2-2V10H4V7.8a2 2 0 0 1 2-2H9z"/>',
      endpoint: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
      controller: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M8 20h8M12 16v4"/>',
      deploy: '<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 21h14"/>',
      sre: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4z"/>',
      dba: '<ellipse cx="12" cy="6.5" rx="7" ry="2.4"/><path d="M5 6.5v11c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4v-11"/><path d="M5 12c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4"/>',
      all: '<circle cx="12" cy="12" r="8"/><path d="M12 5v14M5 12h14M7.2 7.2l9.6 9.6M16.8 7.2 7.2 16.8"/>',
    };

    function canonHandle(handle) {
      if (handle === "user" || handle === "owner") return "boss";
      return handle;
    }

    function profileHandle(handle) {
      const h = canonHandle(handle);
      if (h === "intent" || h === "endpoint") return "ui";
      return h;
    }

    function avatarIconKey(handle) {
      const key = profileHandle(handle);
      return ICONS[key] ? key : (ICONS[handle] ? handle : "all");
    }

    function avatar(handle, size) {
      const key = avatarIconKey(handle);
      const ph = profileHandle(handle);
      const cls = "avatar " + key + (size ? " " + size : "");
      const inner = `<span class="${cls}"><svg viewBox="0 0 24 24">${ICONS[key]}</svg></span>`;
      return `<button type="button" class="avatar-btn" data-agent-handle="${esc(ph)}" aria-label="@${esc(ph)} 资料">${inner}</button>`;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function audienceLabel(m) {
      const aud = m.audience || [];
      const action = m.action || [];
      const cc = m.cc || [];
      if (!aud.length) return "仅页面（agent 不处理）";
      if (aud.indexOf("all") >= 0) return "@all";
      const parts = [];
      if (action.length) parts.push(action.map(h => "@" + h).join(" "));
      if (cc.length) parts.push("cc " + cc.map(h => "@" + h).join(" "));
      return parts.join(" · ") || aud.map(h => "@" + h).join(" ");
    }

    function ackLabel(a) {
      const t = String(a.ack_type || "got").toLowerCase();
      let mark = "知道了";
      if (t === "recv" || t === "received") mark = "收到";
      else if (t === "got" || t === "ok") mark = "知道了";
      return mark + " @" + a.handle;
    }

    function isStaleUnacked(m) {
      if (m.recalled) return false;
      if (!(m.unread || []).length) return false;
      return (Date.now() / 1000 - (m.created_at || 0)) >= 3600;
    }

    function receiptLine(m) {
      const unread = (m.unread || []).map(h => "@" + h);
      const read = Object.keys(m.read || {}).map(h => "@" + h);
      const acks = (m.acks || []).map(ackLabel);
      const parts = [];
      if (isStaleUnacked(m)) parts.push('<span class="unread">超过1小时未读</span>');
      if (unread.length) parts.push('<span class="unread">未读 ' + esc(unread.join(" ")) + "</span>");
      if (read.length) parts.push("已读 " + esc(read.join(" ")));
      if (acks.length) parts.push("ack " + esc(acks.join(" ")));
      if (!parts.length) return "已读";
      return parts.join(" · ");
    }

    function oneLine(s, max) {
      const t = String(s || "").replace(/\s+/g, " ").trim();
      return t.length > max ? t.slice(0, max - 1) + "…" : t;
    }

    let popoverEl = null;
    let fleetCache = null;
    let workBoardCache = null;

    function mergeRosterMeta(data) {
      if (!data) return;
      if (data.display_names) Object.assign(NAMES, data.display_names);
      if (data.handle_duties) Object.assign(DUTIES, data.handle_duties);
    }

    async function refreshStatusCaches() {
      const [wbRes, fleetRes] = await Promise.all([
        fetch("/api/v1/work_board").then(r => r.json()).catch(() => ({})),
        fetch("/api/v1/agent_fleet").then(r => r.json()).catch(() => ({ ok: false, agents: [], runs: [] })),
      ]);
      workBoardCache = wbRes || {};
      fleetCache = fleetRes || { agents: [], runs: [] };
      return { wb: workBoardCache, fleet: fleetCache };
    }

    function fleetAgent(handle) {
      const agents = (fleetCache && fleetCache.agents) || [];
      return agents.find(a => a.handle === handle) || null;
    }

    function workForHandle(handle) {
      const handles = (workBoardCache && workBoardCache.handles) || {};
      return handles[handle] || { awaiting_recv: [], acked_open: [] };
    }

    function phaseText(handle) {
      const agent = fleetAgent(handle);
      if (agent && agent.phase_label) return agent.phase_label;
      if (agent && agent.phase) return PHASE_LABELS[agent.phase] || agent.phase;
      const work = workForHandle(handle);
      if ((work.awaiting_recv || []).length) return PHASE_LABELS.awaiting_recv;
      if ((work.acked_open || []).length) return PHASE_LABELS.acked;
      return PHASE_LABELS.idle;
    }

    function phaseIsActive(handle) {
      const agent = fleetAgent(handle);
      const phase = agent && agent.phase ? String(agent.phase) : "idle";
      return phase !== "idle";
    }

    function taskText(handle) {
      const agent = fleetAgent(handle);
      const runs = (fleetCache && fleetCache.runs) || [];
      let run = null;
      if (agent && agent.running_run_id) {
        run = runs.find(r => r.run_id === agent.running_run_id);
      }
      if (!run) {
        run = runs.find(r => r.target_handle === handle && (r.status === "running" || r.status === "queued"));
      }
      if (run) {
        const rid = run.run_id || agent.running_run_id || "";
        const summary = oneLine(run.text, 100);
        return summary ? ("Dev Task " + rid + " · " + summary) : ("Dev Task " + rid);
      }
      const work = workForHandle(handle);
      const awaiting = work.awaiting_recv || [];
      if (awaiting.length) {
        const row = awaiting[0];
        return "Chat #" + row.id + " 待签收 · " + oneLine(row.preview, 80);
      }
      const acked = work.acked_open || [];
      if (acked.length) {
        const row = acked[0];
        return "Chat #" + row.id + " · " + oneLine(row.preview, 80);
      }
      return "空闲 / 无进行中任务";
    }

    function closeAgentPopover() {
      if (popoverEl) {
        popoverEl.remove();
        popoverEl = null;
      }
    }

    async function openAgentPopover(handle) {
      const h = profileHandle(handle);
      closeAgentPopover();
      const backdrop = document.createElement("div");
      backdrop.className = "agent-popover-backdrop";
      backdrop.innerHTML = `<div class="agent-popover" role="dialog" aria-label="Agent 资料">
        <div class="head">${avatar(h, "lg")}<h2><span class="handle">@${esc(h)}</span><br>${esc(NAMES[h] || h)}</h2>
        <button type="button" class="close">关闭</button></div>
        <p class="duty">${esc(DUTIES[h] || "—")}</p>
        <dl>
          <dt>当前忙闲</dt><dd class="phase-loading">加载中…</dd>
          <dt>目前正在处理</dt><dd class="task-loading">加载中…</dd>
        </dl>
      </div>`;
      backdrop.addEventListener("click", (ev) => {
        if (ev.target === backdrop) closeAgentPopover();
      });
      backdrop.querySelector(".close").addEventListener("click", closeAgentPopover);
      document.body.appendChild(backdrop);
      popoverEl = backdrop;
      await refreshStatusCaches();
      const phaseDd = backdrop.querySelector(".phase-loading");
      const taskDd = backdrop.querySelector(".task-loading");
      if (phaseDd) {
        phaseDd.className = phaseIsActive(h) ? "phase-active" : "phase-idle";
        phaseDd.textContent = phaseText(h);
      }
      if (taskDd) {
        taskDd.textContent = taskText(h);
        taskDd.className = "";
      }
    }

    function renderAgents(agents) {
      agentsEl.innerHTML = (agents || []).map(a => {
        const n = a.unread || 0;
        const badge = n ? `<span class="badge">${n}</span>` : `<span class="badge off">已读</span>`;
        const seen = a.last_seen_at ? ("上次 pull " + a.last_seen_at) : "尚未 pull";
        return `<div class="agent">${avatar(a.handle)}<div class="meta"><div class="name"><span>@${esc(a.handle)}</span>${badge}</div><div class="seen">${esc(seen)}</div></div></div>`;
      }).join("");
    }

    function canRecall(m) {
      if (m.recalled) return false;
      const from = canonHandle(m.from);
      if (from !== "boss") return false;
      const seen = Object.keys(m.read || {}).filter(h => h !== from);
      if (seen.length) return false;
      return (Date.now() / 1000 - (m.created_at || 0)) < 60;
    }

    function paintMsg(div, m) {
      const from = canonHandle(m.from);
      const mine = from === "boss";
      const bossUnread = (m.unread || []).indexOf("boss") >= 0 || (m.unread || []).indexOf("owner") >= 0;
      div.className = "msg"
        + (mine ? " boss" : "")
        + (!mine && bossUnread ? " incoming-unread" : "")
        + (isStaleUnacked(m) ? " stale-unacked" : "")
        + (m.recalled ? " recalled" : "");
      div.dataset.id = String(m.id);
      const name = NAMES[from] || from;
      if (m.recalled) {
        div.innerHTML = `${avatar(from, "lg")}<div class="bubble"><div class="meta"><span class="from">@${esc(from)}</span> ${esc(name)} · ${esc(m.ts)}</div>
          <div class="body">已撤回</div></div>`;
        return;
      }
      const recallBtn = canRecall(m) ? `<button class="recall" type="button" data-id="${m.id}">撤回</button>` : "";
      div.innerHTML = `${avatar(from, "lg")}<div class="bubble"><div class="meta"><span class="from">@${esc(from)}</span> ${esc(name)} · ${esc(m.ts)}</div>
        <div class="body">${esc(m.body)}</div>
        <div class="aud">${esc(audienceLabel(m))}</div>
        <div class="reads">${receiptLine(m)}</div>
        ${recallBtn}</div>`;
    }

    function upsertMsg(m) {
      const empty = logEl.querySelector(".empty");
      if (empty) empty.remove();
      let div = logEl.querySelector('.msg[data-id="' + m.id + '"]');
      const isNew = !div;
      if (!div) {
        div = document.createElement("div");
        logEl.appendChild(div);
      }
      paintMsg(div, m);
      if (isNew) logEl.scrollTop = logEl.scrollHeight;
      if (m.id > lastId) lastId = m.id;
    }

    async function markBossRead(ids) {
      if (!ids.length) return;
      await fetch("/api/v1/mark_read", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from: "boss", ids }),
      });
    }

    async function poll() {
      const res = await fetch("/api/v1/messages?since_id=0");
      const data = await res.json();
      const pending = [];
      (data.messages || []).forEach(m => {
        upsertMsg(m);
        if (!m.recalled && ((m.unread || []).indexOf("boss") >= 0 || (m.unread || []).indexOf("owner") >= 0)) pending.push(m.id);
      });
      renderAgents(data.agents || []);
      mergeRosterMeta(data);
      const n = data.boss_unread || data.owner_unread || 0;
      const badge = document.getElementById("bossUnread");
      badge.textContent = n ? ("未读 " + n) : "";
      badge.className = n ? "badge" : "badge off";
      if (pending.length) {
        await markBossRead(pending);
      }
    }

    async function send() {
      const body = bodyEl.value;
      if (!body.trim()) return;
      const res = await fetch("/api/v1/push_msg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from: "boss", body }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "发送失败");
        return;
      }
      bodyEl.value = "";
      if (data.message) upsertMsg(data.message);
    }

    async function recall(id) {
      const res = await fetch("/api/v1/recall_msg", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from: "boss", id }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "撤回失败");
        return;
      }
      if (data.message) upsertMsg(data.message);
    }

    chipsEl.innerHTML = ["all"].concat(HANDLES).map(h => `<button type="button" data-h="${h}">${avatar(h, "sm")}@${h}</button>`).join("");
    chipsEl.addEventListener("click", (ev) => {
      if (ev.target.closest("[data-agent-handle]")) return;
      const btn = ev.target.closest("button");
      if (!btn) return;
      const token = "@" + btn.getAttribute("data-h") + " ";
      const start = bodyEl.selectionStart || 0;
      bodyEl.value = bodyEl.value.slice(0, start) + token + bodyEl.value.slice(start);
      bodyEl.focus();
      const pos = start + token.length;
      bodyEl.setSelectionRange(pos, pos);
    });
    logEl.addEventListener("click", (ev) => {
      const av = ev.target.closest("[data-agent-handle]");
      if (av) {
        ev.preventDefault();
        openAgentPopover(av.getAttribute("data-agent-handle"));
        return;
      }
      const btn = ev.target.closest("button.recall");
      if (!btn) return;
      recall(Number(btn.getAttribute("data-id")));
    });
    document.body.addEventListener("click", (ev) => {
      const av = ev.target.closest("aside [data-agent-handle], .chips [data-agent-handle]");
      if (!av) return;
      ev.preventDefault();
      ev.stopPropagation();
      openAgentPopover(av.getAttribute("data-agent-handle"));
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeAgentPopover();
    });
    document.getElementById("send").addEventListener("click", send);
    bodyEl.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        send();
      }
    });
    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
