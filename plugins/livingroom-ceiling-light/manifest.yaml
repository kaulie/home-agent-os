id: livingroom-ceiling-light
service_id: livingroom.ceiling_light
group: light
version: "0.1.0"
display_name: 客厅大路灯
description: 优先预录音频唤醒「小书」再开/关客厅大路灯；缺 clip 时 TTS；禁止 LLM

capabilities:
  - capability_id: light.set
    description: >
      能：开关客厅大路灯。必填 state=on|off。内部优先播 wake/on/off 预录音频，缺文件再 TTS。
      不能：拆成 notify.speak；调亮度；控制窗帘或其他灯；听「在呢」。缺 state 则失败。

entry:
  mac: mac/src/mac_edge/plugins/livingroom_light.py
  ios: ios/LivingRoomEdge/LivingRoomEdge/Light/LivingRoomLight.swift
config:
  - key: MAC_EDGE_LIGHT_AUDIO_DIR
    platform: mac
    description: 可选；预录音频目录（默认 plugins/livingroom-ceiling-light/audio）
