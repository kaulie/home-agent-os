id: clock-now
service_id: local.clock
group: clock
version: "0.1.0"
display_name: Local Clock
description: 本机墙上时钟；禁止 LLM

capabilities:
  - capability_id: clock.now
    description: >
      能：读本机墙上时钟，产出 now_iso 与 time_text。问几点必须用本能力。
      不能：LLM 编时刻；用 query.content 或 notify.speak 顶替；TTS；看图；开灯。

entry:
  mac: mac/src/mac_edge/plugins/clock_now.py
config: []
