id: gopro-camera
service_id: gopro.camera
group: camera
version: "0.7.0"
display_name: GoPro Camera
description: 相机拍照 / 录像

capabilities:
  - capability_id: camera.capture
    description: >
      拍一张现场照片并产出本地 asset_ref，不上传。上传走 asset.upload。
      不能：分析照片、投电视、TTS、本步上传、产出 photo_url。
  - capability_id: take_video
    description: >
      能：开始 GoPro 录像。不能：当拍照（用 camera.capture）；分析画面；投屏。

# Local debug actions (not advertised on wire):
# status, stop_recording, latest_photo, upload_photo, download_latest_from_server

entry:
  python: driver.py
  ios: ios/GoProPluginEntry.swift
