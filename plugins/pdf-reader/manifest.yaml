id: pdf-reader
service_id: local.pdf.reader
group: convert
version: "0.1.0"
display_name: PDF 语音朗读器
description: 把 PDF/document Asset 的文字合成为一段可播放的 TTS 音频并登记为 audio Asset

capabilities:
  - capability_id: pdf.reader
    description: PDF/document Asset → 可播放的 TTS 音频 audio Asset（edge-tts mp3 / macOS say AAC）

entry:
  mac: mac/src/mac_edge/plugins/pdf_reader.py
config:
  - key: MAC_EDGE_PDF_READER_TTS_BACKEND
    platform: mac
    description: 合成引擎 edge（默认，edge-tts 神经音色）/ say（macOS 本机，离线）
  - key: MAC_EDGE_PDF_READER_VOICE
    platform: mac
    description: 默认音色名；不设时中文用 zh-CN-XiaoxiaoNeural、英文用 en-US-AriaNeural
  - key: MAC_EDGE_PDF_READER_MAX_CHARS
    platform: mac
    description: 单次合成字数上限（默认 12000）；入参 max_chars 可逐次覆盖，0=不截断
  - key: MAC_EDGE_PDF_READER_TIMEOUT_SEC
    platform: mac
    description: 单次合成总时长上限（默认 240s；须小于 MAC_EDGE_CAPABILITY_TIMEOUT_SEC）
  - key: MAC_EDGE_PDF_READER_TTS_FALLBACK_SAY
    platform: mac
    description: edge-tts 合成失败时是否回退 macOS say（默认 1=回退）
notes: |
  抽文字复用 mac_edge.plugins.pdf_render（PyMuPDF，与 pdf.to_images / display.pdf 同源）；
  合成复用 mac_edge.plugins.tts_file（长文按句切块 + MP3 按帧拼接，无 ffmpeg 依赖）。
  本机可 import pymupdf 且存在可用 TTS 引擎（edge-tts 或 macOS say）时才广告 local.pdf.reader；
  依赖见 mac/requirements.txt。
