# Cloud: /root/chat-gateway/character-service
# Bind loopback only. Talks to ocr-service on 127.0.0.1:9188 via host network.
# Do not publish to LAN or the public internet.
services:
  character:
    build: .
    container_name: home-agent-character
    restart: unless-stopped
    network_mode: host
    environment:
      CHARACTER_HOST: "127.0.0.1"
      CHARACTER_PORT: "9189"
      OCR_SERVICE_URL: "http://127.0.0.1:9188"
      READING_MAX_ANGLE_DEG: "30"
      READING_MIN_SCORE: "0.28"
      READING_MIN_MARGIN: "0.06"
      READING_MAX_DIST_FRAC: "0.55"
    mem_limit: 2g
